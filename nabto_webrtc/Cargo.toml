[package]
name = "nabto_webrtc"
version = "0.1.0"
edition = "2021"
authors = []
license = "MIT OR Apache-2.0"
description = "Nabto WebRTC signaling SDK for Rust"
repository = "https://github.com/nabto/nabto-webrtc-sdk-rust"
keywords = ["nabto", "webrtc", "signaling", "peer-to-peer"]
categories = ["network-programming", "web-programming"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls-webpki-roots"] }
jsonwebtoken = { workspace = true }
p256 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
log = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
clap = { workspace = true }
webrtc = { workspace = true }
anyhow = { workspace = true }
env_logger = { workspace = true }
