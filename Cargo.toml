[workspace]
members = ["nabto_webrtc", "nabto_webrtc_perfect_negotiation"]
default-members = ["nabto_webrtc"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = "1.54.0"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
reqwest = { version = "0.13", default-features = false }
# 1.0.10 removed emSign ECC Root CA - G3 (eMudhra key compromise, Oct 2026)
webpki-roots = "1.0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
jsonwebtoken = { version = "11.1", default-features = false, features = ["use_pem", "rust_crypto"] }
p256 = { version = "0.14", features = ["ecdsa", "pem", "pkcs8"] }
sha2 = "0.11"
hex = "0.4"
rand = "0.10"
uuid = { version = "1.28", features = ["v4"] }
base64 = "0.23"
log = "0.4.34"
webrtc = "0.17.2"
anyhow = "1.0.104"
tokio-test = "0.4"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"

[profile.release-size]
inherits = "release"
opt-level = "z"          # Optimize for size
lto = true               # Enable Link Time Optimization
codegen-units = 1        # Better optimization with single codegen unit
strip = true             # Strip symbols from binary
panic = "abort"          # Abort on panic (smaller binary)
