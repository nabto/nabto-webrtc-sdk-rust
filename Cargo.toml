[package]
name = "nabto-webrtc-sdk"
version = "0.1.0"
edition = "2021"
authors = []
license = "MIT OR Apache-2.0"
description = "Nabto WebRTC signaling SDK for Rust"
repository = "https://github.com/nabto/nabto-webrtc-sdk-rust"
keywords = ["nabto", "webrtc", "signaling", "peer-to-peer"]
categories = ["network-programming", "web-programming"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.21"
futures = "0.3"
reqwest = { version = "0.11", features = ["json"] }
jsonwebtoken = "9.3"
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"
clap = { version = "4.5", features = ["derive"] }
